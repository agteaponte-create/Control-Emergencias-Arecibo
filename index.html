  <style>
  :root {
    --azul-ppr:    #0038a8;
    --azul-oscuro: #002d8a;
    --azul-claro:  #dce8f5;
    --blanco:      #ffffff;
    --gris-panel:  #f0f4f8;
    --gris-borde:  #b8cfe8;
    --texto-dark:  #1a2e4a;
    --texto-med:   #4a6080;
    --escala1: #16a34a; --escala1bg: #dcfce7;
    --escala2: #2563eb; --escala2bg: #dbeafe;
    --escala3: #ca8a04; --escala3bg: #fef9c3;
    --escala4: #d97706; --escala4bg: #ffedd5;
    --escala5: #dc2626; --escala5bg: #fee2e2;
    --verde:#15803d; --rojo:#b91c1c; --amarillo:#92400e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--azul-claro);color:var(--texto-dark);min-height:100vh;}

  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--azul-claro);}
  .login-card{background:#fff;border-radius:14px;padding:40px 36px;max-width:440px;width:100%;box-shadow:0 4px 24px rgba(0,56,168,.14);border:1px solid var(--gris-borde);text-align:center;}
  .login-logo-wrap{width:140px;height:140px;border-radius:50%;background:#fff;border:3px solid var(--azul-ppr);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 2px 16px rgba(0,56,168,.18);}
  .login-logo-wrap img{width:124px;height:124px;object-fit:contain;}
  .login-title{color:var(--azul-ppr);font-size:1.25rem;font-weight:800;letter-spacing:.05em;margin-bottom:4px;}
  .login-sub{color:var(--texto-med);font-size:.82rem;margin-bottom:22px;line-height:1.5;}
  .form-group{text-align:left;margin-bottom:14px;}
  .form-group label{display:block;font-size:.75rem;font-weight:700;color:var(--texto-med);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .form-group input,.form-group select{width:100%;padding:10px 12px;border:1.5px solid var(--gris-borde);border-radius:6px;font-size:.95rem;color:var(--texto-dark);background:#fff;outline:none;transition:border-color .2s;}
  .form-group input:focus{border-color:var(--azul-ppr);box-shadow:0 0 0 3px rgba(0,56,168,.10);}
  .btn-primary{width:100%;padding:12px;background:var(--azul-ppr);color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:background .2s;margin-top:6px;}
  .btn-primary:hover{background:var(--azul-oscuro);}
  .error-msg{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;border-radius:6px;padding:10px;font-size:.88rem;margin-bottom:14px;}

  .app-header{background:var(--azul-ppr);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,56,168,.25);position:sticky;top:0;z-index:100;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-logo-wrap{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);flex-shrink:0;}
  .header-logo-wrap img{width:44px;height:44px;object-fit:contain;}
  .header-title{font-size:.95rem;font-weight:800;letter-spacing:.03em;line-height:1.2;}
  .header-sub{font-size:.7rem;opacity:.85;margin-top:1px;}
  .header-user{font-size:.82rem;text-align:right;line-height:1.4;}
  .header-user strong{display:block;font-size:.88rem;}
  .btn-logout{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:6px 14px;cursor:pointer;font-size:.8rem;font-weight:700;margin-left:12px;white-space:nowrap;}
  .btn-logout:hover{background:rgba(255,255,255,.25);}

  .nav-tabs{display:flex;background:#fff;border-bottom:2px solid var(--gris-borde);padding:0 16px;overflow-x:auto;gap:2px;flex-shrink:0;}
  .nav-tab{padding:10px 16px;border:none;background:none;cursor:pointer;font-size:.83rem;font-weight:600;color:var(--texto-med);border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;}
  .nav-tab.active{color:var(--azul-ppr);border-bottom-color:var(--azul-ppr);}
  .nav-tab:hover:not(.active){color:var(--texto-dark);background:var(--gris-panel);}

  .main-content{padding:18px;max-width:1100px;margin:0 auto;}
  .panel{background:#fff;border:1px solid var(--gris-borde);border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 1px 6px rgba(0,56,168,.07);}
  .panel h2{color:var(--azul-ppr);border-bottom:2px solid var(--gris-borde);padding-bottom:10px;margin-bottom:16px;font-size:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .panel h3{color:var(--texto-dark);font-size:.92rem;margin-bottom:10px;font-weight:700;}
  .panel p{color:var(--texto-med);font-size:.84rem;margin-bottom:10px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:700px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  .field-group{margin-bottom:13px;}
  .field-group label{display:block;font-size:.72rem;font-weight:700;color:var(--texto-med);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .field-group input,.field-group select,.field-group textarea{width:100%;padding:8px 10px;border:1.5px solid var(--gris-borde);border-radius:5px;font-size:.9rem;color:var(--texto-dark);background:#fff;outline:none;transition:border-color .2s;}
  .field-group input:focus,.field-group select:focus,.field-group textarea:focus{border-color:var(--azul-ppr);}
  .field-group input:disabled{background:var(--gris-panel);opacity:.7;cursor:not-allowed;}

  .escala-group{display:flex;gap:6px;flex-wrap:wrap;}
  .escala-btn{flex:1;min-width:90px;padding:10px 4px;border:2px solid #ddd;border-radius:8px;cursor:pointer;text-align:center;font-weight:700;font-size:.75rem;background:#f8f8f8;color:#666;transition:all .2s;line-height:1.3;}
  .escala-btn .num{display:block;font-size:1.2rem;font-weight:900;margin-bottom:2px;}
  .escala-btn.e1.active{background:var(--escala1bg);border-color:var(--escala1);color:var(--escala1);}
  .escala-btn.e2.active{background:var(--escala2bg);border-color:var(--escala2);color:var(--escala2);}
  .escala-btn.e3.active{background:var(--escala3bg);border-color:var(--escala3);color:var(--escala3);}
  .escala-btn.e4.active{background:var(--escala4bg);border-color:var(--escala4);color:var(--escala4);}
  .escala-btn.e5.active{background:var(--escala5bg);border-color:var(--escala5);color:var(--escala5);}

  .status-group{display:flex;gap:6px;}
  .status-btn{flex:1;padding:7px 4px;border:2px solid #ddd;border-radius:6px;cursor:pointer;text-align:center;font-size:.76rem;font-weight:700;background:#f8f8f8;color:#888;transition:all .2s;}
  .status-btn.op.active{background:#dcfce7;border-color:#16a34a;color:#15803d;}
  .status-btn.lim.active{background:#fef9c3;border-color:#ca8a04;color:#92400e;}
  .status-btn.inop.active{background:#fee2e2;border-color:#dc2626;color:#b91c1c;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700;}
  .badge.op{background:#dcfce7;color:#15803d;}
  .badge.lim{background:#fef9c3;color:#92400e;}
  .badge.inop{background:#fee2e2;color:#b91c1c;}
  .badge.ok{background:#dcfce7;color:#15803d;}
  .badge.warn{background:#fef9c3;color:#92400e;}
  .badge.crit{background:#fee2e2;color:#b91c1c;}
  .badge.info{background:#dbeafe;color:#1e40af;}

  .fuel-bar-wrap{height:16px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-top:5px;}
  .fuel-bar{height:100%;border-radius:8px;transition:width .4s,background .4s;}
  .fuel-info{display:flex;justify-content:space-between;font-size:.75rem;color:var(--texto-med);margin-top:2px;}

  .alerta-box{padding:9px 12px;border-radius:6px;font-size:.82rem;margin-bottom:10px;font-weight:600;}
  .alerta-ok{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
  .alerta-warn{background:#fef9c3;color:#92400e;border:1px solid #fde047;}
  .alerta-crit{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}

  .bitacora-scroll{max-height:200px;overflow-y:auto;background:var(--gris-panel);border-radius:6px;padding:10px;border:1px solid var(--gris-borde);}
  .bitacora-entry{font-size:.8rem;padding:4px 0;border-bottom:1px dashed var(--gris-borde);}
  .bitacora-entry:last-child{border-bottom:none;}
  .bitacora-ts{color:var(--azul-ppr);font-weight:700;}
  .bitacora-input-row{display:flex;gap:8px;margin-bottom:10px;}
  .bitacora-input-row input{flex:1;padding:8px 10px;border:1.5px solid var(--gris-borde);border-radius:5px;font-size:.88rem;}

  .dep-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .dep-tab{padding:6px 14px;border:2px solid var(--gris-borde);border-radius:20px;cursor:pointer;font-weight:600;font-size:.8rem;background:#fff;color:var(--texto-med);transition:all .2s;}
  .dep-tab.active{background:var(--azul-ppr);color:#fff;border-color:var(--azul-ppr);}
  .dep-tab:hover:not(.active){border-color:var(--azul-ppr);color:var(--azul-ppr);}

  .dash-card{background:#fff;border:1px solid var(--gris-borde);border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,56,168,.07);}
  .dash-card h4{font-size:.75rem;color:var(--texto-med);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .dash-card .val{font-size:1.5rem;font-weight:800;color:var(--azul-ppr);}
  .dash-card .sub{font-size:.72rem;color:var(--texto-med);margin-top:2px;}

  .res-table{width:100%;border-collapse:collapse;font-size:.82rem;}
  .res-table th{background:var(--azul-ppr);color:#fff;padding:7px 9px;text-align:left;font-size:.75rem;white-space:nowrap;}
  .res-table td{padding:7px 9px;border-bottom:1px solid var(--gris-borde);vertical-align:top;}
  .res-table tr:nth-child(even) td{background:var(--gris-panel);}

  .btn-sec{padding:7px 14px;background:var(--gris-panel);color:var(--azul-ppr);border:1.5px solid var(--azul-ppr);border-radius:5px;cursor:pointer;font-size:.82rem;font-weight:700;transition:all .2s;}
  .btn-sec:hover{background:var(--azul-ppr);color:#fff;}
  .btn-pdf{padding:9px 16px;background:#c0392b;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:.82rem;font-weight:700;transition:background .2s;}
  .btn-pdf:hover{background:#96281b;}
  .btn-add{padding:7px 13px;background:#15803d;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:.8rem;font-weight:700;}
  .btn-add:hover{background:#166534;}
  .btn-del{padding:3px 10px;background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;border-radius:4px;cursor:pointer;font-size:.75rem;}

  .informes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px;}
  .informe-card{background:var(--gris-panel);border:1px solid var(--gris-borde);border-radius:8px;padding:15px;text-align:center;}
  .informe-card h4{color:var(--azul-ppr);margin-bottom:4px;font-size:.92rem;}
  .informe-card p{color:var(--texto-med);font-size:.76rem;margin-bottom:10px;line-height:1.4;}
  .sep{height:1px;background:var(--gris-borde);margin:14px 0;}
  .hint{font-size:.78rem;color:var(--texto-med);font-style:italic;padding:8px 0;}
  .req-box{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;border-radius:6px;padding:9px 12px;font-size:.82rem;margin-bottom:12px;}
</style>
</head>

        <div className="field-group"><label>Objetivos Operacionales SMART (ICS 202)</label>
          <textarea rows="3" value={inc.objetivos} disabled={readOnly} onChange={e=>upd('objetivos',e.target.value)} placeholder="1. Restablecer perímetro en 2h. 2. Evacuar sector afectado. 3. Coordinar con SEAU..."/>
        </div>
        <div className="field-group"><label>Restricciones / Limitaciones Operacionales</label>

        <div className="grid-3">

          <div className="field-group"><label>Cargo / Rol</label><input value={inc.oficial_cargo||usuario?.rol||''} disabled={readOnly} onChange={e=>upd('oficial_cargo',e.target.value)}/></div>

  // ── MÓDULO BITÁCORA ICS 214 ───────────────────────────────────────────────
  const ModuloBitacora = ({dep,onUpdate,usuario,readOnly}) => {
    const [entrada,setEntrada]=useState('');
    const registrar = () => {
      if(!entrada.trim()) return;
      const e={id:Date.now(),ts:ts(),oficial:`${usuario.rango} ${usuario.nombre} (${usuario.placa})`,desc:entrada.trim()};
      onUpdate({...dep,bitacora:[e,...dep.bitacora]});
      setEntrada('');
    };
    return (
      <div className="panel">
        <h2>Bitácora Oficial — ICS 214</h2>
        {!readOnly&&(
          <div className="bitacora-input-row">
            <input value={entrada} onChange={e=>setEntrada(e.target.value)} onKeyDown={e=>e.key==='Enter'&&registrar()} placeholder="Evento, decisión, acción tomada..."/>
            <button className="btn-sec" onClick={registrar}>Registrar</button>
          </div>
        )}
        <div className="bitacora-scroll">
          {dep.bitacora.length===0?<p className="hint">Sin entradas.</p>
            :dep.bitacora.map(e=>(
              <div key={e.id} className="bitacora-entry">
                <span className="bitacora-ts">[{e.ts}]</span>{' '}
                <span style={{color:'var(--texto-med)'}}>{e.oficial}:</span>{' '}{e.desc}
              </div>
            ))}
        </div>
      </div>
    );
  };

      {k:'med',l:'Plan Médico'},{k:'bit',l:'Bitácora ICS 214'},
    ];
    const escCls = `e${dep.escala}`;
    return (
      <div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap'}}>
          <h3 style={{color:'var(--azul-ppr)',fontSize:'1rem'}}>{dep.nombre}</h3>
          <span className={`badge`} style={{background:escalaBg(dep.escala),color:escalaClr(dep.escala),fontWeight:800}}>

        {tab==='gen'&&<ModuloGeneradores dep={dep} onUpdate={onUpdate} readOnly={readOnly}/>}
        {tab==='cis'&&<ModuloCisternas dep={dep} onUpdate={onUpdate} readOnly={readOnly}/>}
        {tab==='ali'&&<ModuloAlimentos dep={dep} onUpdate={onUpdate} readOnly={readOnly}/>}
        {tab==='per'&&<ModuloPersonal dep={dep} onUpdate={onUpdate} readOnly={readOnly}/>}
        {tab==='com'&&<ModuloComms dep={dep} onUpdate={onUpdate} readOnly={readOnly}/>}
        {tab==='med'&&<ModuloMedico dep={dep} onUpdate={onUpdate} readOnly={readOnly}/>}
        {tab==='bit'&&<ModuloBitacora dep={dep} onUpdate={onUpdate} usuario={usuario} readOnly={readOnly}/>}

  // ── VISTA ZONA (con selector de dependencia) ──────────────────────────────
  const VistaZona = ({zona,onUpdateDep,usuario,readOnly}) => {
    const deps = Object.keys(zona.dependencias);

      <div>

          <div className="dep-tabs">
            {deps.map(d=><button key={d} className={`dep-tab ${depActiva===d?'active':''}`} onClick={()=>setDepActiva(d)}>{d}</button>)}
          </div>
        </div>
        <VistaDependencia dep={dep} onUpdate={nd=>onUpdateDep(depActiva,nd)} usuario={usuario} readOnly={readOnly}/>

  // ── DASHBOARD GLOBAL ──────────────────────────────────────────────────────
  const Dashboard = ({data}) => {
    const todasDeps = [];
    Object.values(data.zonas).forEach(z=>Object.values(z.dependencias).forEach(d=>todasDeps.push({zona:z.nombre,...d})));
    const totalPersonal = todasDeps.reduce((s,d)=>s+d.personal.length,0);
    const totalGens     = todasDeps.reduce((s,d)=>s+d.generadores.length,0);
    const gensCrit      = todasDeps.reduce((s,d)=>s+d.generadores.filter(g=>calcHoras(g.pct,g.cap_gal,g.consumo_gph)<72||g.pct<90).length,0);
    const totalCis      = todasDeps.reduce((s,d)=>s+d.cisternas.length,0);
    const aliInsuf      = todasDeps.filter(d=>d.alimentos.estado==='insuficiente').length;
    const escalMax      = Math.min(...todasDeps.map(d=>d.escala));
    
    return (
      <div>
        <div className="panel" style={{background:escalaBg(escalMax),border:`2px solid ${escalaClr(escalMax)}`}}>
          <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
            <div>
              <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--texto-med)',textTransform:'uppercase'}}>Escala Mayor Activa — Área de Arecibo</div>
              <div style={{fontSize:'1.6rem',fontWeight:900,color:escalaClr(escalMax)}}>ESCALA {escalMax} — {ESCALA_LOCAL[escalMax].label}</div>
              <div style={{fontSize:'.84rem',color:'var(--texto-dark)'}}>{ESCALA_LOCAL[escalMax].desc}</div>
              <div style={{fontSize:'.76rem',color:'var(--texto-med)',marginTop:2}}>Equivalencia FEMA: {ESCALA_LOCAL[escalMax].fema}</div>
            </div>
          </div>
        </div>
        <div className="grid-4" style={{marginBottom:18}}>
          <div className="dash-card"><h4>Personal Total</h4><div className="val">{totalPersonal}</div><div className="sub">Todas las zonas</div></div>
          <div className="dash-card"><h4>Generadores</h4>
            <div className="val" style={{color:gensCrit===0?'var(--verde)':'var(--rojo)'}}>{totalGens-gensCrit}/{totalGens}</div>
            <div className="sub">{gensCrit>0?`⚠ ${gensCrit} bajo estándar`:'Todos cumplen 72h/90%'}</div>
          </div>
          <div className="dash-card"><h4>Cisternas</h4><div className="val">{totalCis}</div><div className="sub">Registradas</div></div>
          <div className="dash-card"><h4>Alimentos</h4>
            <div className="val" style={{color:aliInsuf===0?'var(--verde)':'var(--rojo)'}}>{aliInsuf===0?'OK':`${aliInsuf} dep.`}</div>
            <div className="sub">{aliInsuf===0?'Todas disponibles':'Con insuficiencia'}</div>
          </div>
        </div>
        <div className="panel">
          <h2>Estado por Zona y Municipio</h2>
          <div style={{overflowX:'auto'}}>
            <table className="res-table">
              <thead><tr><th>Zona</th><th>Municipio</th><th>Escala</th><th>Incidente</th><th>Generadores</th><th>Cisternas</th><th>Alimentos</th><th>Personal</th><th>Comms 800MHz</th></tr></thead>
              <tbody>
                {Object.values(data.zonas).map(z=>
                  Object.values(z.dependencias).map((d,di)=>(
                    <tr key={`${z.nombre}-${d.nombre}`}>
                      {di===0&&<td rowSpan={Object.keys(z.dependencias).length} style={{fontWeight:700,background:'var(--gris-panel)',verticalAlign:'middle'}}>{z.nombre}</td>}
                      <td><strong>{d.nombre}</strong></td>
                      <td><span className={`badge`} style={{background:escalaBg(d.escala),color:escalaClr(d.escala)}}>{d.escala} — {ESCALA_LOCAL[d.escala].label}</span></td>
                      <td style={{fontSize:'.76rem',maxWidth:140}}>{d.incidente.nombre||<em style={{color:'var(--texto-med)'}}>Sin incidente</em>}</td>
                      <td>{d.generadores.length===0?<span style={{color:'var(--texto-med)'}}>—</span>:d.generadores.map(g=>{
                        const h=calcHoras(g.pct,g.cap_gal,g.consumo_gph);
                        const ok=g.pct>=90&&h>=72;
                        return <div key={g.id} style={{fontSize:'.72rem'}}><span className={`badge ${g.status==='Operativo'?'op':g.status==='Limitado'?'lim':'inop'}`}>{g.status}</span> {g.nombre||'GEN'} {g.pct}% {!ok&&'⚠'}</div>;
                      })}</td>
                      <td>{d.cisternas.length===0?<span style={{color:'var(--texto-med)'}}>—</span>:d.cisternas.map(c=><div key={c.id} style={{fontSize:'.72rem'}}><span className={`badge ${c.status==='Operativo'?'op':'lim'}`}>{c.status}</span> {c.nombre||'CIS'} {c.pct}%</div>)}</td>
                      <td><span className={`badge ${d.alimentos.estado==='disponible'?'ok':'crit'}`}>{d.alimentos.estado==='disponible'?'Disponible':'Insuficiente'}</span></td>
                      <td>{d.personal.length} efectivos</td>
                      <td><span className={`badge ${d.comms.red800==='Operativo'?'op':d.comms.red800==='Fallo Parcial'?'lim':'inop'}`}>{d.comms.red800}</span></td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  };

  // ── INFORMES PDF ──────────────────────────────────────────────────────────
  const ModuloInformes = ({data,usuario}) => {
    const {jsPDF} = window.jspdf;
    const todasDeps = [];
    Object.values(data.zonas).forEach(z=>Object.values(z.dependencias).forEach(d=>todasDeps.push({zona:z.nombre,...d})));
    const fg = new Date().toLocaleString('es-PR',{hour12:false});

    const hdrICS = (doc,form,titulo,sub) => {
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(0,0,0);
      doc.text(titulo,108,12,{align:'center'});
      doc.setFontSize(9); doc.text(form,108,18,{align:'center'});
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(60,60,60);
      doc.text('Policía de Puerto Rico — Área de Arecibo',108,23,{align:'center'});
      doc.text(sub,108,28,{align:'center'});
      doc.setDrawColor(0,56,168); doc.setLineWidth(0.8); doc.line(10,30,206,30);
      doc.setTextColor(0,0,0); doc.setFontSize(7); doc.text('Generado: '+fg,206,27,{align:'right'});
      return 34;
    };
    const bx=(doc,x,y,w,h,lbl,val,lsz=6.5,vsz=8)=>{
      doc.setDrawColor(100,100,100); doc.setLineWidth(0.25); doc.rect(x,y,w,h);
      doc.setFont('helvetica','bold'); doc.setFontSize(lsz); doc.setTextColor(40,40,40); doc.text(lbl,x+1.5,y+lsz*0.38+1.2);
      doc.setFont('helvetica','normal'); doc.setFontSize(vsz); doc.setTextColor(0,0,0);
      const ln=doc.splitTextToSize(val||'',w-3); doc.text(ln,x+1.5,y+lsz*0.38+1.2+vsz*0.38+1.5);
    };
    const shdr=(doc,txt,y,W=196)=>{doc.setFillColor(200,215,240);doc.rect(10,y,W,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(0,38,108);doc.text(txt,12,y+4.2);return y+7;};
    const thdr=(doc,cols,y)=>{doc.setFillColor(0,56,168);doc.rect(cols[0].x,y,cols.reduce((s,c)=>s+c.w,0),6.5,'F');doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(255,255,255);cols.forEach(c=>doc.text(c.h,c.x+1,y+4.3));return y+7;};
    const pie=(doc,form)=>{const p=doc.internal.getNumberOfPages();for(let i=1;i<=p;i++){doc.setPage(i);doc.setDrawColor(0,56,168);doc.setLineWidth(0.3);doc.line(10,286,206,286);doc.setFontSize(7);doc.setTextColor(100,100,100);doc.text('Policía de Puerto Rico — Área de Arecibo | Formulario '+form,10,290);doc.text('Pág. '+i+'/'+p,206,290,{align:'right'});}};
    const firma=(doc,y,n,p,c,t)=>{if(y>252){doc.addPage();y=20;}doc.rect(10,y,90,15);doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(0,56,168);doc.text(t,12,y+4);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(0,0,0);doc.text(n||'',12,y+8);doc.text(p?'Placa: '+p:'',12,y+12);doc.line(12,y+13,98,y+13);doc.setFontSize(6.5);doc.setTextColor(100,100,100);doc.text('Firma / Fecha',12,y+15);return y+20;};

    const gen201 = () => {
      const doc=new jsPDF({unit:'mm',format:'letter'});
      todasDeps.forEach((d,di)=>{
        if(di>0) doc.addPage();
        const inc=d.incidente; let y=hdrICS(doc,'ICS 201','Briefing del Incidente',`Zona: ${d.zona} | Municipio: ${d.nombre}`);
        y=shdr(doc,'SECCIÓN 1 — DATOS DEL INCIDENTE',y);
        bx(doc,10,y,90,9,'Nombre del Incidente',inc.nombre||'');bx(doc,100,y,40,9,'Número de Incidente',inc.numero||'');bx(doc,140,y,66,9,'Zona / Municipio',d.zona+' / '+d.nombre);y+=9;
        bx(doc,10,y,98,9,'Fecha/Hora Inicio Periodo',inc.periodo_inicio?new Date(inc.periodo_inicio).toLocaleString('es-PR',{hour12:false}):'');
        bx(doc,108,y,98,9,'Fecha/Hora Fin Periodo',inc.periodo_fin?new Date(inc.periodo_fin).toLocaleString('es-PR',{hour12:false}):'');y+=9;
        const escNom={1:'Normal',2:'Probable',3:'Potencial',4:'Emergencia',5:'Desastre'};
        bx(doc,10,y,98,9,'Escala NMEAD/PR','Escala '+d.escala+' — '+escNom[d.escala]);
        bx(doc,108,y,98,9,'Equivalencia FEMA/ICS',ESCALA_LOCAL[d.escala].fema);y+=9;
        y=shdr(doc,'SECCIÓN 2 — MAPA / ÁREA DEL INCIDENTE',y);
        doc.setDrawColor(150,150,150);doc.rect(10,y,196,28);doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(150,150,150);doc.text('[Adjuntar mapa o croquis del área afectada — '+d.nombre+', PR]',108,y+14,{align:'center'});y+=29;
        y=shdr(doc,'SECCIÓN 3 — RESUMEN DE LA SITUACIÓN ACTUAL (ICS 201)',y);
        doc.rect(10,y,196,36);const sl=doc.splitTextToSize(inc.situacion||'',192);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0,0,0);doc.text(sl,12,y+5);y+=37;
        y=shdr(doc,'SECCIÓN 4 — ACCIONES INICIALES Y MEDIDAS TOMADAS',y);
        doc.rect(10,y,196,24);const ol=doc.splitTextToSize(inc.objetivos||'',192);doc.text(ol,12,y+5);y+=25;
        if(inc.restricciones){y=shdr(doc,'SECCIÓN 5 — RESTRICCIONES / LIMITACIONES',y);doc.rect(10,y,196,10);doc.text(doc.splitTextToSize(inc.restricciones,192),12,y+4);y+=11;}
        y=shdr(doc,'SECCIÓN 6 — ORGANIZACIÓN — PERSONAL CLAVE',y);
        const cols6=[{x:10,w:55,h:'Cargo'},{x:65,w:80,h:'Nombre / Rango'},{x:145,w:30,h:'Placa'},{x:175,w:31,h:'Firma'}];
        y=thdr(doc,cols6,y);
        [['Coordinador de Incidente','Sgto. Miguel A. De Jesús Jiménez','8-30526'],['Coordinador Alterno','Agte. José C. Aponte Cancel','31093'],['Comandante de Zona','',''],['Oficial de Seguridad','',''],['Oficial de Enlace / PIO','',''],['Oficial de Operaciones','','']].forEach((r,ri)=>{
          cols6.forEach((c,ci)=>{doc.rect(c.x,y,c.w,7);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(0,0,0);doc.text(r[ci]||'',c.x+1.5,y+4.5);});y+=7;
        });
        y+=4;firma(doc,y,inc.oficial_nombre,inc.oficial_placa,inc.oficial_cargo,'PREPARADO POR');
      });
      pie(doc,'201');doc.save('ICS-201_Briefing_'+new Date().toISOString().slice(0,10)+'.pdf');
    };

    const gen202 = () => {
      const doc=new jsPDF({unit:'mm',format:'letter'});
      todasDeps.forEach((d,di)=>{
        if(di>0) doc.addPage();
        const inc=d.incidente; let y=hdrICS(doc,'ICS 202','Objetivos del Incidente',`Zona: ${d.zona} | Municipio: ${d.nombre}`);
        y=shdr(doc,'SECCIÓN 1 — IDENTIFICACIÓN',y);
        bx(doc,10,y,90,9,'Nombre del Incidente',inc.nombre||'');bx(doc,100,y,40,9,'Número',inc.numero||'');bx(doc,140,y,66,9,'Zona / Municipio',d.zona+' / '+d.nombre);y+=9;
        bx(doc,10,y,98,9,'Periodo — Inicio',inc.periodo_inicio?new Date(inc.periodo_inicio).toLocaleString('es-PR',{hour12:false}):'');
        bx(doc,108,y,98,9,'Periodo — Fin',inc.periodo_fin?new Date(inc.periodo_fin).toLocaleString('es-PR',{hour12:false}):'');y+=9;
        bx(doc,10,y,98,9,'Escala NMEAD/PR','Escala '+d.escala+' — '+ESCALA_LOCAL[d.escala].label);
        bx(doc,108,y,98,9,'Equivalencia FEMA/ICS',ESCALA_LOCAL[d.escala].fema);y+=9;
        y=shdr(doc,'SECCIÓN 2 — PRIORIDADES DEL INCIDENTE (IS-100 / NIMS)',y);
        ['1. Seguridad de vida — Personal respondedor y público en general','2. Estabilización del incidente — Contener y mitigar el impacto','3. Protección de la propiedad y el medio ambiente'].forEach(p=>{doc.rect(10,y,196,7);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0,0,0);doc.text(p,12,y+4.5);y+=7;});
        y+=3;y=shdr(doc,'SECCIÓN 3 — OBJETIVOS OPERACIONALES SMART (ICS 202)',y);
        doc.rect(10,y,196,48);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0,0,0);doc.text(doc.splitTextToSize(inc.objetivos||'',192),12,y+5);y+=49;
        y=shdr(doc,'SECCIÓN 4 — INSTRUCCIONES DE OPERACIÓN / DIRECTRICES',y);doc.rect(10,y,196,28);y+=29;
        y=shdr(doc,'SECCIÓN 5 — RESTRICCIONES / LIMITACIONES',y);

              <div key={item.t} className="informe-card">
                <h4>{item.t}</h4><p>{item.d}</p>
                <button className="btn-pdf" style={{width:'100%',padding:'10px'}} onClick={item.fn}>⬇ Descargar PDF</button>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  // ── APP PRINCIPAL CON FIREBASE ───────────────────────────────────────────
  const App = () => {
    const [usuario,  setUsuario]  = useState(null);
    const [data,     setData]     = useState(estadoInicial);
    const [tab,      setTab]      = useState('dashboard');
    const [loading,  setLoading]  = useState(true);
    const [saving,   setSaving]   = useState(false);
    const [error,    setError]    = useState('');
    const [loginLoad,setLoginLoad]= useState(false);

    // ── Escuchar sesión Firebase Auth ─────────────────────────────────────
    useEffect(() => {
      const unsub = auth.onAuthStateChanged(async fbUser => {
        if(fbUser) {
          try {
            // Intentar cargar perfil desde Firestore
            const snap = await db.collection('usuarios').doc(fbUser.uid).get();
            if(snap.exists){
              const perfil = snap.data();
              setUsuario({...perfil, uid: fbUser.uid, email: fbUser.email});
              setTab(perfil.nivel==='coord'?'dashboard':'mizona');
            } else {
              // Perfil no en Firestore — usar perfil local por correo
              const perfilLocal = Object.values(PERSONAL_AUTH).find(p =>
                fbUser.email === p.email
              ) || buscarPerfilPorEmail(fbUser.email);
              if(perfilLocal){
                setUsuario({...perfilLocal, uid: fbUser.uid, email: fbUser.email});
                setTab(perfilLocal.nivel==='coord'?'dashboard':'mizona');
              } else {
                // Fallback generico coordinador si email reconocido
                const esCoord = ['jcaponte@policia.pr.gov','majesus@policia.pr.gov'].includes(fbUser.email);
                if(esCoord){
                  const p = fbUser.email.includes('jcaponte')
                    ? {nombre:'José C. Aponte Cancel',rango:'Agte.',rol:'Coordinador Alterno',nivel:'coord',placa:'31093'}
                    : {nombre:'Miguel A. De Jesús Jiménez',rango:'Sgto.',rol:'Coordinador',nivel:'coord',placa:'8-30526'};
                  setUsuario({...p, uid: fbUser.uid, email: fbUser.email});
                  setTab('dashboard');
                } else {
                  await auth.signOut();
                  setError('Perfil no encontrado. Contacte al Coordinador.');
                }
              }
            }
          } catch(e){
            // Error de Firestore — usar perfil local de emergencia
            const p = fbUser.email.includes('jcaponte')
              ? {nombre:'José C. Aponte Cancel',rango:'Agte.',rol:'Coordinador Alterno',nivel:'coord',placa:'31093'}
              : fbUser.email.includes('majesus')
              ? {nombre:'Miguel A. De Jesús Jiménez',rango:'Sgto.',rol:'Coordinador',nivel:'coord',placa:'8-30526'}
              : null;
            if(p){ setUsuario({...p, uid:fbUser.uid, email:fbUser.email}); setTab('dashboard'); }
            else { await auth.signOut(); setError('Error de acceso. Contacte al Coordinador.'); }
          }
        } else {
          setUsuario(null);
        }
        setLoading(false);
      });
      return () => unsub();
    }, []);

    // Buscar perfil por email en tabla local
    const buscarPerfilPorEmail = (email) => {
      const map = {
        'jcaponte@policia.pr.gov':  {nombre:'José C. Aponte Cancel',      rango:'Agte.',rol:'Coordinador Alterno',nivel:'coord',placa:'31093'},
        'majesus@policia.pr.gov':   {nombre:'Miguel A. De Jesús Jiménez', rango:'Sgto.',rol:'Coordinador',        nivel:'coord',placa:'8-30526'},
        'zona-are@policia.pr.gov':  {nombre:'Comandante Zona Arecibo',     rango:'Cap.', rol:'Comandante de Zona', nivel:'zona', placa:'ZONA-ARE',zona:'Zona Arecibo'},
        'zona-flo@policia.pr.gov':  {nombre:'Comandante Zona Florida',     rango:'Cap.', rol:'Comandante de Zona', nivel:'zona', placa:'ZONA-FLO',zona:'Zona Florida'},
        'zona-mor@policia.pr.gov':  {nombre:'Comandante Zona Morovis',     rango:'Cap.', rol:'Comandante de Zona', nivel:'zona', placa:'ZONA-MOR',zona:'Zona Morovis'},
      };
      return map[email]||null;
    };

    // ── Escuchar datos en tiempo real desde Firestore ─────────────────────
    useEffect(() => {
      if(!usuario) return;
      const unsub = db.collection('smea_data').doc('arecibo')
        .onSnapshot(snap => {
          if(snap.exists){
            const remote = snap.data();
            setData(prev => mergeData(prev, remote));
          }
        }, err => console.error('Firestore:', err));
      return () => unsub();
    }, [usuario]);

    // ── Merge datos remotos con estado local ──────────────────────────────
    const mergeData = (local, remote) => {
      if(!remote || !remote.zonas) return local;
      const merged = JSON.parse(JSON.stringify(local));
      Object.keys(remote.zonas||{}).forEach(z => {
        if(!merged.zonas[z]) return;
        Object.keys(remote.zonas[z]?.dependencias||{}).forEach(d => {
          if(merged.zonas[z].dependencias[d]){
            merged.zonas[z].dependencias[d] = {
              ...merged.zonas[z].dependencias[d],
              ...remote.zonas[z].dependencias[d],
            };
          }
        });
      });
      return merged;
    };

    // ── Guardar zona/dep en Firestore ─────────────────────────────────────
    const updateDep = async (zonaNombre, depNombre, nuevaDep) => {
      // Actualizar estado local inmediatamente
      setData(prev => ({
        ...prev,
        zonas: {
          ...prev.zonas,
          [zonaNombre]: {
            ...prev.zonas[zonaNombre],
            dependencias: {
              ...prev.zonas[zonaNombre].dependencias,
              [depNombre]: nuevaDep,
            }
          }
        }
      }));
      // Persistir en Firestore
      setSaving(true);
      try {
        const path = `zonas.${zonaNombre}.dependencias.${depNombre}`;
        await db.collection('smea_data').doc('arecibo').set(
          { zonas: { [zonaNombre]: { dependencias: { [depNombre]: nuevaDep } } } },
          { merge: true }
        );
      } catch(e){ console.error('Error guardando:', e); }
      finally { setSaving(false); }
    };

    // ── Login con Firebase Auth ───────────────────────────────────────────
    const handleLogin = async ({email, password}) => {
      setLoginLoad(true); setError('');
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch(e){
        const msgs = {
          'auth/user-not-found':'Usuario no registrado. Contacte al Coordinador.',
          'auth/wrong-password':'Contraseña incorrecta.',
          'auth/invalid-email':'Correo electrónico inválido.',
          'auth/too-many-requests':'Demasiados intentos. Intente más tarde.',
        };
        setError(msgs[e.code]||'Error de acceso: '+e.message);
      }
      setLoginLoad(false);
    };

    const handleLogout = async () => { await auth.signOut(); setData(estadoInicial); setTab('dashboard'); };

    if(loading) return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'var(--azul-claro)'}}>
        <div className="login-logo-wrap" style={{width:100,height:100}}><img src={LOGO} alt="SMEA" style={{width:86,height:86,objectFit:'contain'}}/></div>
        <div style={{color:'var(--azul-ppr)',fontWeight:700,fontSize:'1rem'}}>Cargando Sistema...</div>
      </div>
    );

    if(!usuario) return <LoginFirebase onLogin={handleLogin} error={error} loading={loginLoad}/>;

    const isCoord    = usuario.nivel==='coord';
    const zonaUsuario= usuario.zona||'Zona Arecibo';
    const zonaMap    = {zareA:'Zona Arecibo',zfloB:'Zona Florida',zmorC:'Zona Morovis'};
    const navCoord   = [{k:'dashboard',l:'Dashboard Global'},{k:'zareA',l:'Zona Arecibo'},{k:'zfloB',l:'Zona Florida'},{k:'zmorC',l:'Zona Morovis'},{k:'informes',l:'Informes PDF'}];
    const navZona    = [{k:'mizona',l:zonaUsuario},{k:'informes',l:'Informes PDF'}];
    const navTabs    = isCoord?navCoord:navZona;

    return (
      <div>
        <header className="app-header">
          <div className="header-left">
            <div className="header-logo-wrap"><img src={LOGO} alt="SMEA"/></div>
            <div>
              <div className="header-title">SISTEMA MANEJO EMERGENCIAS</div>
              <div className="header-sub">Área de Arecibo — Policía de Puerto Rico</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {saving&&<span style={{fontSize:'.72rem',color:'rgba(255,255,255,.8)',background:'rgba(0,0,0,.2)',padding:'3px 10px',borderRadius:10}}>Guardando...</span>}
            <div className="header-user">
              <strong>{usuario.rango} {usuario.nombre}</strong>
              <span style={{fontSize:'.7rem',opacity:.85}}>{usuario.rol} — Placa {usuario.placa}</span>
            </div>
            <button className="btn-logout" onClick={handleLogout}>SALIR</button>
          </div>
        </header>

        <div className="nav-tabs">
          {navTabs.map(t=><button key={t.k} className={`nav-tab ${tab===t.k?'active':''}`} onClick={()=>setTab(t.k)}>{t.l}</button>)}
        </div>

        <div className="main-content">
          {tab==='dashboard'&&isCoord&&<Dashboard data={data}/>}
          {Object.entries(zonaMap).map(([k,zonaNombre])=>
            tab===k&&isCoord&&
            <VistaZona key={k} zona={data.zonas[zonaNombre]}
              onUpdateDep={(dep,nd)=>updateDep(zonaNombre,dep,nd)}
              usuario={usuario} readOnly={false}/>
          )}
          {tab==='mizona'&&!isCoord&&
            <VistaZona zona={data.zonas[zonaUsuario]}
              onUpdateDep={(dep,nd)=>updateDep(zonaUsuario,dep,nd)}
              usuario={usuario} readOnly={false}/>}
          {tab==='informes'&&<ModuloInformes data={data} usuario={usuario}/>}
        </div>
      </div>
    );
  };

  const root=ReactDOM.createRoot(document.getElementById('root'));
  root.render(<React.StrictMode><App/></React.StrictMode>);
</script>
</body>
</html>
